# TEMPLATE ONLY — never commit a filled-in copy of this file.
#
# This is not applied by kustomization.yaml and is not part of the automated
# deploy. It documents the one Secret value the app needs — MONGO_PASSWORD
# only. Hosts, username, replica-set name and auth source are NOT secret and
# live in configmap.yaml instead (src/config/env.js assembles the connection
# string from the ConfigMap vars + this password at startup; the password is
# passed to the MongoDB driver as a separate `auth` option, never
# concatenated into a connection string). Populate this out-of-band per
# environment — see Docs/DEPLOYMENT.md "Secrets" for the recommended
# approaches (a secrets manager + External Secrets Operator, or
# `kubectl create secret` run by hand/by a separate, access-controlled
# pipeline — never checked into git).
apiVersion: v1
kind: Secret
metadata:
  name: imps-velocity-mongo-credentials
  namespace: imps-velocity
type: Opaque
stringData:
  MONGO_PASSWORD: "<password>"
