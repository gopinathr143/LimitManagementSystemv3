# TEMPLATE ONLY — never commit a filled-in copy of this file.
#
# This is not applied by kustomization.yaml and is not part of the automated
# deploy. It documents the one Secret the app needs (MONGO_URI, which carries
# the replica-set connection string and credentials) and the shape GoCD's
# deploy stage expects at `imps-velocity-mongo-credentials` in each target
# namespace. Populate it out-of-band per environment — see
# Docs/DEPLOYMENT.md "Secrets" for the recommended approaches (a secrets
# manager + External Secrets Operator, or `kubectl create secret` run by
# hand/by a separate, access-controlled pipeline — never checked into git).
apiVersion: v1
kind: Secret
metadata:
  name: imps-velocity-mongo-credentials
  namespace: imps-velocity
type: Opaque
stringData:
  MONGO_URI: "mongodb://<user>:<password>@<host1>:27017,<host2>:27017,<host3>:27017/imps_velocity?replicaSet=<rsName>&authSource=admin&retryWrites=true&w=majority"
