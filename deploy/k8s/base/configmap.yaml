# Non-secret runtime config only. MONGO_URI (contains credentials) lives in
# secret.yaml instead — see that file's comment for how it's actually supplied.
apiVersion: v1
kind: ConfigMap
metadata:
  name: imps-velocity-config
data:
  PORT: "3000"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  MONGO_DB_NAME: "imps_velocity"
  ACTOR_HEADER: "x-actor-id"
