# Runs the schema/index bootstrap before a deploy rolls out — real Liquibase
# (db/changelog/*.xml, this project's source of truth), via the
# self-contained image built from deploy/liquibase/Dockerfile. Run this
# BEFORE the Deployment rollout, not after, so a new app pod never starts
# against a schema it doesn't expect.
#
# The app image is NOT used here anymore — this Job runs the dedicated
# Liquibase image instead (deploy/liquibase/README.md). scripts/init-db.js
# (still bundled in the app image) remains the test suite's own fast,
# no-Docker-dependency bootstrap; it is not this Job's mechanism.
#
# Idempotent: a changeset Liquibase has already recorded as run (tracked in
# the DATABASECHANGELOG collection this image creates) is skipped on
# re-apply — safe to run this Job on every deploy, including when nothing
# changed (verified in this session: a second `update` run reports
# "Run: 0, Previously run: 23").
apiVersion: batch/v1
kind: Job
metadata:
  name: imps-velocity-migration
  # Namespace is set per environment by the overlay (deploy/k8s/migration/overlays/*).
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          # Placeholder — set at deploy time via `kustomize edit set image` (see
          # deploy/k8s/migration/base/kustomization.yaml and .gocd.yaml). This is
          # the imps-liquibase-migration image (deploy/liquibase/Dockerfile), a
          # separate image from the app's own — not imps-velocity-system.
          image: imps-liquibase-migration:build-me
          # CMD in the image already defaults to "update" — explicit here for
          # clarity and so this Job's intent doesn't depend on reading the Dockerfile.
          args: ["update"]
          envFrom:
            - configMapRef:
                name: imps-velocity-config
            - secretRef:
                name: imps-velocity-mongo-credentials
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
